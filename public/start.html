<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b35b3f" />
    <title>กำลังเลือกเส้นทาง | WisdomAI</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f7f3f1; color: #2d2421; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: min(100%, 520px); background: #fff; border: 1px solid #eadbd5; border-radius: 18px; padding: 26px; box-shadow: 0 18px 50px rgba(66, 36, 26, .12); }
      h1 { margin: 0; font-size: 1.55rem; }
      .lead { margin: 8px 0 20px; color: #6f5c55; line-height: 1.5; }
      .target { display: flex; justify-content: space-between; gap: 12px; padding: 14px; margin-top: 10px; border: 1px solid #eadbd5; border-radius: 12px; }
      .target strong { display: block; }
      .target span { color: #806b63; font-size: .9rem; text-align: right; }
      .target[data-state="ready"] { border-color: #6da77a; background: #f4fbf5; }
      .target[data-state="failed"] { border-color: #d99090; background: #fff7f7; }
      .status { min-height: 48px; margin: 20px 0 8px; padding: 12px; border-radius: 10px; background: #f4ece8; line-height: 1.45; }
      button, a { min-height: 44px; border-radius: 10px; font: inherit; font-weight: 700; }
      button { width: 100%; border: 0; background: #b35b3f; color: #fff; cursor: pointer; }
      .manual { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
      .manual a { display: grid; place-items: center; border: 1px solid #cfae9f; color: #8c432d; text-decoration: none; }
      small { display: block; margin-top: 16px; color: #806b63; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <h1>WisdomAI Smart Entry</h1>
      <p class="lead">ระบบกำลังเลือกเส้นทางที่เชื่อมต่อได้และตอบสนองเร็วที่สุด รองรับทั้งมือถือและคอมพิวเตอร์</p>
      <section class="target" data-target="vercel" data-state="checking"><strong>ระบบหลัก</strong><span data-status>กำลังตรวจ…</span></section>
      <section class="target" data-target="cloudflare" data-state="checking"><strong>ระบบสำรอง</strong><span data-status>กำลังตรวจ…</span></section>
      <div class="status" role="status" aria-live="polite" data-main-status>กำลังเริ่มตรวจสอบ…</div>
      <button type="button" data-retry hidden>ลองตรวจใหม่</button>
      <div class="manual">
        <a href="https://wisdomai-react.vercel.app/login">เข้าระบบหลัก</a>
        <a href="https://wisdomai.pages.dev/login">เข้าระบบสำรอง</a>
      </div>
      <small>ไม่ส่งข้อมูลบัญชีหรือข้อมูลพนักงานระหว่างการตรวจเส้นทาง</small>
    </main>
    <script type="module" src="/smart-entry.js"></script>
  </body>
</html>
