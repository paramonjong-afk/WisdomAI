name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run advance settlement tests
        run: npm run test:advance-settlement-slip-preview

      - name: Run reconciliation tests
        run: npm run test:advance-reconciliation

      - name: Run Accounting transfer-slip tests
        run: npm run test:accounting-transfer-slips && npm run test:accounting-transfer-slip-review

      - name: Run transfer lineage test
        run: npm run test:transfer-slip-lineage

      - name: Run Advance handoff tests
        run: npm run test:advance-report && npm run test:advance-confirmation

      - name: Run HR handoff test
        run: npm run test:hr-confirmation-bundle

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ${{ secrets.CLOUDFLARE_PAGES_PROJECT }} --branch main
