name: Verify Sales Expense Accounting

on:
  push:
    branches:
      - codex/sales-expense-accounting
    paths:
      - '.github/workflows/verify-sales-expense-accounting.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/sales-expense-postgres-runtime.test.mjs'
      - 'scripts/sql/sales-expense-accounting-*.sql'
      - 'scripts/sales-expense-accounting.test.ts'
      - 'src/pages/ProjectControls/**'
      - 'src/services/salesExpenseAccounting.ts'
      - 'supabase/migrations/20260831040817_sales_expense_accounting_workflow.sql'
  pull_request:
    paths:
      - '.github/workflows/verify-sales-expense-accounting.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/sales-expense-postgres-runtime.test.mjs'
      - 'scripts/sql/sales-expense-accounting-*.sql'
      - 'scripts/sales-expense-accounting.test.ts'
      - 'src/pages/ProjectControls/**'
      - 'src/services/salesExpenseAccounting.ts'
      - 'supabase/migrations/20260831040817_sales_expense_accounting_workflow.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wisdomai_sales_expense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wisdomai_sales_expense_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wisdomai_sales_expense_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source contracts
        run: npm run test:sales-expense-accounting

      - name: Verify local PostgreSQL WASM runtime
        run: npm run test:sales-expense-postgres

      - name: Create isolated baseline
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/sql/sales-expense-accounting-baseline.sql

      - name: Apply sales expense migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260831040817_sales_expense_accounting_workflow.sql

      - name: Run PostgreSQL runtime smoke
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/sql/sales-expense-accounting-runtime.test.sql

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
