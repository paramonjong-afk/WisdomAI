name: Deploy Supabase Edge Functions

# Auto-deploys every function under supabase/functions/ whenever one changes
# on main. Set up 2026-09-04 so future Edge Function changes (from any
# agent/AI working this repo) reach Production without anyone needing
# Supabase CLI access on their own machine -- see AGENTS.md's Multi-Agent
# Work Claim Protocol and docs/SUPABASE_CLI_ACCESS.md for context. Requires
# two repository secrets (added once, by a human, in GitHub repo Settings ->
# Secrets and variables -> Actions -- never by an agent):
#   SUPABASE_ACCESS_TOKEN  - a Supabase personal access token
#   SUPABASE_PROJECT_REF   - xkieyqixlufjqructjkr

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy every function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF repo secrets are not set. Add them in Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
          for dir in supabase/functions/*/; do
            fn="$(basename "$dir")"
            case "$fn" in
              _shared|.*) continue ;;
            esac
            echo "== Deploying $fn =="
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done
